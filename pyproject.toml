[project]
name = "visionai-sdk-python"
dynamic = ["version"]
description = "VisionAI SDK for Python"
readme = "README.md"
authors = [
    { name = "Tony Yang", email = "tonyyang@linkervision.com" }
]
requires-python = ">=3.11"
dependencies = [
    # <1 guards the same class of risk requests/aiohttp/wrapt are bounded
    # against below. httpx is still pre-1.0, so a minor release could in
    # principle rename Client._send_single_request/AsyncClient._send_single_request
    # (the private APIs instrument() patches) without a major bump -- the
    # weekly CI compatibility matrix plus instrument()'s AttributeError
    # warning are what actually catches that; a tight upper bound here would
    # just fight other packages' own httpx pins for little benefit.
    "httpx>=0.28.1,<1",
    "pydantic>=2.12.5",
    "cryptography>=46.0.5",
    "PyJWT[cryptography]>=2.8.0",
]

[project.optional-dependencies]
requests = ["requests>=2.31,<3"]
aiohttp = ["aiohttp>=3.9,<4"]
instrumentation = ["wrapt>=1.16,<3"]

[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]

[tool.uv]
# Mitigate supply chain attacks. Kept in sync with
# .github/dependabot.yml's cooldown.default-days (7 days), so a `uv lock` run
# by any contributor is bound by the same age floor Dependabot's cooldown
# already enforces -- not just PRs Dependabot itself opens.
# https://docs.astral.sh/uv/guides/integration/dependabot/#dependency-cooldown
exclude-newer = "7 days"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
extend-select = ["B", "UP", "I", "F"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.15.11",
    "requests>=2.31,<3",
    "aiohttp>=3.9,<4",
    "wrapt>=1.16,<3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
