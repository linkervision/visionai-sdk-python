version: 2

updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: Asia/Taipei
    cooldown:
      default-days: 7
      include:
        - httpx
        - requests
        - aiohttp
        - wrapt
    allow:
      - dependency-name: httpx
      - dependency-name: requests
      - dependency-name: aiohttp
      - dependency-name: wrapt
    groups:
      instrumentation-http-clients:
        patterns:
          - httpx
          - requests
          - aiohttp
          - wrapt
    open-pull-requests-limit: 1
    versioning-strategy: lockfile-only

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "02:30"
      timezone: Asia/Taipei
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 1
